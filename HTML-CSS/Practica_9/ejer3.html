<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <table border="1">
            <tr>
                <td colspan="2">
                    <p><b>Pizza Shop 2.0</b></p>
                </td>
            </tr>

            <tr>
                <td>
                    <p>Name</p>
                </td>
                <td><input type="text" id="camponombre" name="nombre"></td>
            </tr>

            <tr>
                <td>
                    <p>Pizza Topping</p>
                </td>
                <td>
                    <input type="radio" name="topping" id="topping1" value="Pepperoni">
                    <label for="topping1">Supreme</label>
                    <br>
                    <input type="radio" name="topping" id="topping2" value="Vegetarian">
                    <label for="topping2">Vegetarian</label>
                    <br>
                    <input type="radio" name="topping" id="topping3" value="Hawaiian">
                    <label for="topping3">Hawaiian</label>
                </td>
            </tr>

            <tr>
                <td>
                    <p>Pizza Sauce</p>
                </td>
                <td>
                    <select name="sauce" id="seleccsauce">
                        <option value="tomato">Tomato</option>
                        <option value="alfredo">Alfredo</option>
                        <option value="pesto">Pesto</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <p>Optional Extras</p>
                </td>
                <td>
                    <input type="checkbox" name="extra" id="extra1" value="Extra Cheese">
                    <label for="extra1">Extra Cheese</label>
                    <input type="checkbox" name="extra" id="extra2" value="Gluten Free Base">
                    <label for="extra2">Gluten Free Base</label>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <label for="campointructions">Delivery Instructions:</label>
                    <br>
                    <textarea name="instructions" id="campointructions" cols="60" rows="5"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Send my Order">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
