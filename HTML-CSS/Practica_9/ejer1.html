<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="salutation">Salutarion</label>
        <br>
        <select name="control1" id="salutation">
            <option value="None">--None--</option>
            <option value="MR">MR</option>
            <option value="MRS">MRS</option>
        </select>

        <br><br>

        <label for="firstname">First Name:</label>
        <input type="text" name="control2" id="firstname">

        <br><br>

        <label for="lastname">Last Name:</label>
        <input type="text" name="control3" id="lastname">

        <br><br>

        <label for="selecgenero">Gender:</label>

        <input type="radio" name="radialgenero" id="radialmasc" value="Male">
        <label for="radialfem">Male</label>
        <input type="radio" name="radialgenero" id="radialfem" value="Female">
        <label for="radialfem">Female</label>

        <br><br>

        <label for="email">Email</label>
        <input type="text" name="control4" id="email">

        <br><br>

        <label for="fechanacimiento">Date of Birth:</label>
        <input type="date" name="nacimiento" id="fechanacimiento">

        <br><br>

        <label for="adressinput">Adress:</label>
        <br>
        <textarea name="adress" id="adressinput"></textarea>

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
